<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ar-Raqmi — the pen hasn't lifted">
  <defs>
    <linearGradient id="limeFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9F99D"/>
      <stop offset="100%" stop-color="#F0F4E2"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="900" y="40" width="316" height="260" rx="28"/>
    </clipPath>
    <clipPath id="avatarClip">
      <circle cx="86" cy="76" r="22"/>
    </clipPath>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="340" fill="#F7FBE9"/>

  <!-- article card, mirroring the site hero -->
  <g>
    <rect x="900" y="40" width="316" height="260" rx="28" fill="#FFFFFF" stroke="#E2EBCB" stroke-width="1.5"/>
    <g clip-path="url(#cardClip)">
      <rect x="900" y="40" width="316" height="118" fill="url(#limeFade)"/>
    </g>
    <text x="928" y="186" font-family="Inter" font-weight="700" font-size="11" letter-spacing="1.5" fill="#4D7C0F">LATEST</text>
    <text x="928" y="226" font-family="Fraunces" font-weight="600" font-size="26" letter-spacing="-0.3" fill="#1A2E05">the ink is still wet.</text>
    <text x="928" y="256" font-family="Inter" font-weight="400" font-size="13" fill="#6B7A4A">essay · 2026</text>
  </g>

  <!-- header row -->
  <g>
    <image x="64" y="54" width="44" height="44" clip-path="url(#avatarClip)" href="avatar.png" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="86" cy="76" r="22" fill="none" stroke="#E2EBCB" stroke-width="1.5"/>
    <text x="122" y="85" font-family="Inter" font-weight="600" font-size="27" letter-spacing="-0.3" fill="#1A2E05">ar-Raqmi</text>
  </g>
  <line x1="0" y1="112" x2="1280" y2="112" stroke="#E2EBCB" stroke-width="1"/>

  <!-- chip -->
  <g>
    <rect x="64" y="140" width="344" height="38" rx="19" fill="#D9F99D"/>
    <rect x="82" y="152" width="15" height="15" rx="4" fill="#4D7C0F"/>
    <text x="110" y="166" font-family="Inter" font-weight="600" font-size="15.5" fill="#1A2E05">Data Science · AI/ML · Open Source</text>
  </g>

  <!-- display heading -->
  <text x="64" y="252" font-family="Fraunces" font-weight="600" font-size="59" letter-spacing="0" fill="#1A2E05">the pen hasn&#8217;t lifted.</text>

  <!-- subtitle -->
  <text x="64" y="294" font-family="Inter" font-weight="400" font-size="20.5" fill="#44571F">Bridging Data &amp; Hikmah — solving problems from pages to pixels.</text>
</svg>
